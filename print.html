<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grey's Cook Book - Print Edition</title>
  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root {
      --page-width: 8.5in;
      --page-height: 11in;
      --page-margin-top: 0.72in;
      --page-margin-right: 0.72in;
      --page-margin-bottom: 0.78in;
      --page-margin-left: 0.72in;
      --ink: #1f1a17;
      --muted: #6c625b;
      --line: #d7cfc7;
      --line-dark: #8b7f75;
      --line-light: #ebe4dc;
      --accent: #3b312b;
      --screen-bg: #e7e4e0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--screen-bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.52;
    }

    body {
      padding: 24px 0;
    }

    .screen-note,
    .loading,
    .error-box {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto 18px;
      background: #fff;
      border: 1px solid #d5d0ca;
      padding: 18px 22px;
    }

    .screen-note h1 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      color: var(--accent);
    }

    .screen-note p,
    .loading p,
    .error-box p {
      margin: 8px 0;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 10px 14px;
      border: 1px solid #b7aea5;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }

    .actions button:hover {
      background: #f6f3ef;
    }

    .error-box {
      border-color: #c88;
      color: #6d1f1f;
      display: none;
    }

    .book {
      width: 100%;
    }

    .page {
      width: var(--page-width);
      min-height: var(--page-height);
      margin: 0 auto 20px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      padding:
        var(--page-margin-top)
        var(--page-margin-right)
        var(--page-margin-bottom)
        var(--page-margin-left);
      page-break-after: always;
      break-after: page;
      overflow: hidden;
      position: relative;
    }

    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .page-inner {
      min-height: calc(
        var(--page-height) - var(--page-margin-top) - var(--page-margin-bottom)
      );
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .title-page,
    .section-page,
    .toc-page,
    .about-page {
      justify-content: center;
      text-align: center;
    }

    .book-title {
      margin: 0;
      font-size: 2.45rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .book-subtitle {
      margin: 10px 0 0;
      font-size: 1.02rem;
      color: var(--muted);
      font-style: italic;
    }

    .byline {
      margin-top: 28px;
      font-size: 1rem;
    }

    .small-divider {
      width: 130px;
      height: 1px;
      background: var(--line-dark);
      margin: 18px auto;
    }

    .section-kicker {
      margin: 0 0 10px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }

    .section-title {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .section-note {
      margin: 0 auto;
      max-width: 460px;
      color: var(--muted);
      font-size: 1rem;
    }

    .toc-title,
    .about-title {
      margin: 0;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    .toc-list {
      list-style: none;
      margin: 30px auto 0;
      padding: 0;
      max-width: 560px;
      text-align: left;
    }

    .toc-list li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 10px;
      padding: 10px 0;
      font-size: 1rem;
    }

    .toc-name {
      font-weight: 600;
      white-space: nowrap;
    }

    .toc-dots {
      border-bottom: 1px dotted var(--line-dark);
      transform: translateY(-0.2em);
    }

    .toc-page-number {
      min-width: 24px;
      text-align: right;
      white-space: nowrap;
    }

    .recipe-header h2 {
      margin: 0;
      font-size: 1.95rem;
      line-height: 1.12;
      color: var(--accent);
    }

    .recipe-category {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 16px 0 18px;
    }

    .recipe-content {
      display: grid;
      grid-template-columns: 0.95fr 1.25fr;
      gap: 26px;
      align-items: start;
    }

    .recipe-block {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .recipe-block h3 {
      margin: 0 0 10px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.17em;
      color: var(--accent);
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    .recipe-block ul,
    .recipe-block ol {
      margin: 0;
      padding-left: 1.15rem;
    }

    .recipe-block li {
      margin-bottom: 0.45rem;
      font-size: 0.98rem;
    }

    .recipe-notes {
      margin-top: 18px;
      padding: 12px 14px 2px;
      border-top: 1px solid var(--line);
      background: #faf8f5;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .recipe-notes h4 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
    }

    .recipe-notes p {
      margin: 0 0 10px;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .recipe-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .about-page p {
      margin: 0 0 12px;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .cover-page,
    .section-page,
    .toc-page {
      position: relative;
    }

    .cover-page::before,
    .section-page::before,
    .toc-page::before {
      content: "";
      position: absolute;
      inset: 0.18in;
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 0;
    }

    .cover-page::after,
    .section-page::after,
    .toc-page::after {
      content: "";
      position: absolute;
      inset: 0.3in;
      border: 1px solid var(--line-light);
      pointer-events: none;
      z-index: 0;
    }

    .cover-page {
      justify-content: center;
      text-align: center;
    }

    .cover-kicker {
      margin: 0 0 14px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.26em;
    }

    .cover-title {
      margin: 0;
      font-size: 2.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.08;
    }

    .cover-subtitle {
      margin: 14px auto 0;
      max-width: 430px;
      font-size: 1.02rem;
      color: var(--muted);
      font-style: italic;
    }

    .cover-byline {
      margin-top: 30px;
      font-size: 1rem;
    }

    .cover-divider {
      width: 160px;
      height: 1px;
      background: var(--line-dark);
      margin: 22px auto;
    }

    .cover-bottom-note {
      margin-top: 40px;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-page {
      justify-content: center;
      text-align: center;
    }

    .section-page .section-kicker {
      margin: 0 0 14px;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.28em;
    }

    .section-page .section-title {
      margin: 0;
      font-size: 2.15rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.1;
    }

    .section-page .small-divider {
      width: 150px;
      margin: 20px auto 18px;
    }

    .section-page .section-note {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.98rem;
      font-style: italic;
      line-height: 1.55;
    }

    .section-ornament {
      margin: 0 auto 18px;
      font-size: 1rem;
      color: var(--line-dark);
      letter-spacing: 0.35em;
    }

    .section-bottom-ornament {
      margin: 22px auto 0;
      font-size: 0.9rem;
      color: var(--line-dark);
      letter-spacing: 0.35em;
    }

    .toc-page .toc-title {
      margin-bottom: 8px;
      font-size: 1.95rem;
      letter-spacing: 0.08em;
    }

    .toc-intro {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .toc-ornament {
      margin: 0 auto 16px;
      font-size: 1rem;
      color: var(--line-dark);
      letter-spacing: 0.35em;
    }

    .toc-wrap {
      max-width: 560px;
      margin: 28px auto 0;
      padding: 12px 18px 0;
    }

    .toc-list li + li {
      border-top: 1px solid #f2ede7;
    }

    @page {
      size: 8.5in 11in;
      margin: 0;
    }

    @media print {
      html,
      body {
        background: #fff;
        margin: 0;
        padding: 0;
      }

      .screen-note,
      .loading,
      .error-box {
        display: none !important;
      }

      .page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="screen-note">
    <h1>Grey's Cook Book Print Builder</h1>
    <p>This page pulls recipes from your category pages and rebuilds them into a cleaner printable cookbook.</p>
    <p>After it finishes loading, use Print and save as PDF.</p>
    <div class="actions">
      <button onclick="window.print()">Print / Save PDF</button>
      <button onclick="buildBook()">Reload Recipes</button>
    </div>
  </div>

  <div id="loading" class="loading">
    <p><strong>Loading recipes...</strong></p>
    <p>Please wait while the cookbook is assembled.</p>
  </div>

  <div id="errors" class="error-box"></div>

  <main id="book" class="book"></main>

  <script>
    const CATEGORY_PAGES = [
      { title: "Appetizers", url: "/appetizers/" },
      { title: "Breakfast", url: "/breakfast/" },
      { title: "Breads", url: "/breads/" },
      { title: "Sides", url: "/sides/" },
      { title: "Main Dishes", url: "/meats/" },
      { title: "Fish", url: "/fish/" },
      { title: "Desserts", url: "/dessert/" }
    ];

    const SECTION_NOTES = {
      "Appetizers": "Start the meal right with favorites that feel at home on any table.",
      "Breakfast": "Morning staples worth waking up for.",
      "Breads": "The kind of breads that belong beside soup, breakfast, or Sunday supper.",
      "Sides": "The dishes that make the plate feel complete.",
      "Main Dishes": "Hearty suppers, casseroles, and favorites meant for real appetites.",
      "Fish": "Simple skillet and supper-table fish done the right way.",
      "Desserts": "Sweet endings worth saving room for."
    };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (ch) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[ch];
      });
    }

    function extractRecipesFromPage(doc, category) {
      const cards = doc.querySelectorAll(".recipe-card");

      return [...cards].map(card => {
        const title = card.querySelector("h3")?.textContent.trim() || "Recipe";

        const ingredients = [
          ...card.querySelectorAll(".ingredients-list li")
        ].map(li => li.textContent.trim()).filter(Boolean);

        const directions = [
          ...card.querySelectorAll(".instructions p")
        ].map(p => p.textContent.trim()).filter(Boolean);

        const notes = [
          ...card.querySelectorAll(".note-box, .variation-box")
        ].map(n => n.innerText.trim()).filter(Boolean);

        return {
          title,
          category,
          ingredients,
          directions,
          notes
        };
      });
    }

    function renderTitlePage() {
      return `
        <section class="page">
          <div class="page-inner title-page cover-page">
            <p class="cover-kicker">Family Recipes</p>
            <div class="section-ornament">✦ ✦ ✦</div>
            <h1 class="cover-title">Grey's Cook Book</h1>
            <div class="cover-divider"></div>
            <p class="cover-subtitle">
              A collection of home cooking favorites from greycooks.com
            </p>
            <p class="cover-byline">By Grey Lancaster</p>
            <p class="cover-bottom-note">Southern • Family • Tried and True</p>
          </div>
        </section>
      `;
    }

    function renderToc(tocItems) {
      return `
        <section class="page">
          <div class="page-inner toc-page">
            <div class="toc-ornament">✦ ✦ ✦</div>
            <h2 class="toc-title">Table of Contents</h2>
            <div class="small-divider"></div>
            <p class="toc-intro">A chapter-by-chapter path through the recipes, from first bites to dessert.</p>
            <div class="toc-wrap">
              <ul class="toc-list">
                ${tocItems.map(item => `
                  <li>
                    <span class="toc-name">${escapeHtml(item.title)}</span>
                    <span class="toc-dots"></span>
                    <span class="toc-page-number">${item.page}</span>
                  </li>
                `).join("")}
              </ul>
            </div>
            <div class="section-bottom-ornament">✦ ✦ ✦</div>
          </div>
        </section>
      `;
    }

    function renderSectionPage(title) {
      return `
        <section class="page">
          <div class="page-inner section-page">
            <p class="section-kicker">Chapter</p>
            <div class="section-ornament">✦ ✦ ✦</div>
            <h2 class="section-title">${escapeHtml(title)}</h2>
            <div class="small-divider"></div>
            <p class="section-note">${escapeHtml(SECTION_NOTES[title] || "")}</p>
            <div class="section-bottom-ornament">✦ ✦ ✦</div>
          </div>
        </section>
      `;
    }

    function renderRecipe(recipe, pageNumber) {
      const longRecipe =
        recipe.ingredients.length > 12 ||
        recipe.directions.length > 7 ||
        recipe.notes.join(" ").length > 550;

      return `
        <section class="page">
          <div class="page-inner">
            <header class="recipe-header">
              <h2>${escapeHtml(recipe.title)}</h2>
              <p class="recipe-category">${escapeHtml(recipe.category)}</p>
            </header>

            <div class="divider"></div>

            <div class="recipe-content" style="${longRecipe ? "grid-template-columns: 1fr;" : ""}">
              <div class="recipe-block">
                <h3>Ingredients</h3>
                <ul>
                  ${recipe.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}
                </ul>
              </div>

              <div class="recipe-block">
                <h3>Directions</h3>
                <ol>
                  ${recipe.directions.map(d => `<li>${escapeHtml(d)}</li>`).join("")}
                </ol>
              </div>
            </div>

            ${recipe.notes.length ? `
              <div class="recipe-notes">
                <h4>Notes</h4>
                ${recipe.notes.map(n => `<p>${escapeHtml(n)}</p>`).join("")}
              </div>
            ` : ""}

            <footer class="recipe-footer">
              <span>greycooks.com</span>
              <span>${pageNumber}</span>
            </footer>
          </div>
        </section>
      `;
    }

    function renderAboutPage(pageNumber) {
      return `
        <section class="page">
          <div class="page-inner about-page">
            <h2 class="about-title">About the Author</h2>
            <div class="small-divider"></div>
            <p>Grey Lancaster shares approachable home cooking rooted in family meals, practical kitchen know-how, and recipes worth making again.</p>
            <p>This collection brings together favorites from greycooks.com in a format meant for real kitchens, real tables, and real use.</p>
            <footer class="recipe-footer">
              <span>greycooks.com</span>
              <span>${pageNumber}</span>
            </footer>
          </div>
        </section>
      `;
    }

    async function buildBook() {
      const book = document.getElementById("book");
      const loading = document.getElementById("loading");
      const errorsBox = document.getElementById("errors");

      if (!book) {
        console.error('Missing <main id="book"></main>');
        return;
      }

      if (loading) {
        loading.style.display = "block";
      }

      if (errorsBox) {
        errorsBox.style.display = "none";
        errorsBox.innerHTML = "";
      }

      book.innerHTML = "";

      const builtSections = [];
      const errors = [];

      for (const cat of CATEGORY_PAGES) {
        try {
          const res = await fetch(cat.url);

          if (!res.ok) {
            throw new Error(`HTTP ${res.status} for ${cat.url}`);
          }

          const text = await res.text();
          const doc = new DOMParser().parseFromString(text, "text/html");
          const recipes = extractRecipesFromPage(doc, cat.title);

          builtSections.push({
            title: cat.title,
            recipes
          });
        } catch (e) {
          errors.push(`Failed loading ${cat.url}: ${e.message}`);
          builtSections.push({
            title: cat.title,
            recipes: []
          });
        }
      }

      const tocItems = [];
      let pageNumber = 3;

      for (const section of builtSections) {
        tocItems.push({
          title: section.title,
          page: pageNumber
        });
        pageNumber += 1;
        pageNumber += section.recipes.length;
      }

      const aboutPageNumber = pageNumber;

      let html = "";
      html += renderTitlePage();
      html += renderToc(tocItems);

      pageNumber = 3;

      for (const section of builtSections) {
        html += renderSectionPage(section.title);
        pageNumber += 1;

        for (const recipe of section.recipes) {
          html += renderRecipe(recipe, pageNumber);
          pageNumber += 1;
        }
      }

      html += renderAboutPage(aboutPageNumber);

      book.innerHTML = html;

      if (errors.length && errorsBox) {
        errorsBox.style.display = "block";
        errorsBox.innerHTML = `
          <p><strong>Some pages did not load:</strong></p>
          <ul>
            ${errors.map(err => `<li>${escapeHtml(err)}</li>`).join("")}
          </ul>
        `;
      }

      if (loading) {
        loading.style.display = "none";
      }
    }

    buildBook();
  </script>
</body>
</html>
